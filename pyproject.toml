[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
backend-path = ["."]

[project]
name = "chompjs"
version = "1.4.1"
description = "Parsing JavaScript objects into Python dictionaries"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Mariusz Obajtek", email = "nykakin@gmail.com" },
]
keywords = ["parsing", "parser", "JavaScript", "json", "json5", "webscrapping"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
]

[project.urls]
Homepage = "https://github.com/Nykakin/chompjs"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "orjson==3.13.0",
    "pytest>=9.1.1",
]

[tool.setuptools]
include-package-data = true
packages = ["chompjs"]

[[tool.setuptools.ext-modules]]
name = "_chompjs"
sources = [
    "_chompjs/module.c",
    "_chompjs/parser.c",
    "_chompjs/buffer.c",
]

[tool.setuptools.package-data]
chompjs = ["py.typed"]

[tool.pytest.ini_options]
addopts = ["--ignore=build_backend.py", "--doctest-modules"]
